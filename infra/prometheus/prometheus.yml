global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # .NET servisleri metrikleri OTLP ile collector'a push eder; Prometheus
  # collector'ın `prometheus` exporter'ından (:8889) pull eder.
  # GOTCHA: Servislerde ayrı bir /metrics endpoint'i YOK — bu yüzden
  # doğrudan servisleri scrape etmek boş/404 döner.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
